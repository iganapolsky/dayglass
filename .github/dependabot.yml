version: 2
# Green bumps are squash-merged by dependabot-auto-merge.yml.
# Do not add reviewers or CODEOWNERS. That is what emailed Igor.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
