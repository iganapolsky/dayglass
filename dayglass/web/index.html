<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dayglass</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #141416;
      --surface2: #1c1c1f;
      --surface3: #252528;
      --border: #2a2a2e;
      --border-focus: #4a4a52;
      --text: #e8e8ec;
      --text2: #9898a0;
      --text3: #5c5c66;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.12);
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.1);
      --orange: #f59e0b;
      --red: #ef4444;
      --radius: 10px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      --mono: "SF Mono", "JetBrains Mono", "Fira Code", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top Bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.3px;
      color: var(--text);
      flex-shrink: 0;
    }

    .logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-soft);
    }

    .command-bar {
      flex: 1;
      max-width: 560px;
      position: relative;
    }

    .command-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px 8px 36px;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.15s;
    }

    .command-input:focus {
      border-color: var(--accent);
    }

    .command-input::placeholder {
      color: var(--text3);
    }

    .command-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text3);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .status-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .tab-bar {
      display: flex;
      gap: 2px;
    }

    .tab {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.15s;
    }

    .tab:hover { color: var(--text); background: var(--surface2); }
    .tab.active { color: var(--text); background: var(--surface3); }

    /* ── Main Content ── */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .main::-webkit-scrollbar { width: 6px; }
    .main::-webkit-scrollbar-track { background: transparent; }
    .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Stats Row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text3);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .stat-sub {
      font-size: 11px;
      color: var(--text3);
      margin-top: 2px;
      font-family: var(--mono);
    }

    /* ── Timeline ── */
    .timeline-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .timeline-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text2);
    }

    .timeline-filter {
      display: flex;
      gap: 4px;
    }

    .filter-btn {
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 12px;
      color: var(--text3);
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      transition: all 0.15s;
    }

    .filter-btn:hover { color: var(--text2); }
    .filter-btn.active { color: var(--text); background: var(--surface2); border-color: var(--border); }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .timeline-item {
      display: flex;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      transition: background 0.15s;
      cursor: default;
    }

    .timeline-item:hover {
      background: var(--surface);
    }

    .timeline-time {
      flex-shrink: 0;
      width: 56px;
      font-size: 12px;
      font-family: var(--mono);
      color: var(--text3);
      padding-top: 2px;
    }

    .timeline-marker {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 20px;
    }

    .marker-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border-focus);
      flex-shrink: 0;
      margin-top: 5px;
    }

    .marker-dot.screen { background: var(--accent); }
    .marker-dot.meeting { background: var(--orange); }
    .marker-dot.audio { background: var(--green); }

    .marker-line {
      width: 1px;
      flex: 1;
      background: var(--border);
      margin-top: 4px;
    }

    .timeline-content {
      flex: 1;
      min-width: 0;
    }

    .timeline-type {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .type-screen { color: var(--accent); }
    .type-meeting { color: var(--orange); }
    .type-audio { color: var(--green); }

    .timeline-text {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text2);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    .timeline-text.meeting-title {
      font-weight: 600;
      color: var(--text);
      font-size: 14px;
      -webkit-line-clamp: 1;
    }

    .meeting-summary {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text3);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* ── Quick Actions ── */
    .quick-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }

    .action-btn:hover {
      background: var(--surface2);
      color: var(--text);
      border-color: var(--border-focus);
    }

    .action-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* ── Result Panel ── */
    .result-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 16px;
      max-height: 320px;
      overflow-y: auto;
    }

    .result-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .result-panel-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .result-panel-close {
      background: none;
      border: none;
      color: var(--text3);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .result-panel-close:hover { background: var(--surface2); color: var(--text); }

    .result-panel-body {
      font-size: 13px;
      line-height: 1.65;
      color: var(--text2);
      white-space: pre-wrap;
    }

    /* ── Bottom Bar ── */
    .bottombar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      font-size: 12px;
      color: var(--text3);
      flex-shrink: 0;
    }

    .bottombar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .bottombar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--mono);
    }

    .cost-badge {
      color: var(--green);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="topbar">
    <div class="logo">
      <div class="logo-dot"></div>
      dayglass
    </div>

    <div class="command-bar">
      <svg class="command-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        class="command-input"
        id="commandInput"
        placeholder="Ask anything, search, or run a command..."
        onkeydown="handleCommandKey(event)"
      />
    </div>

    <div class="topbar-actions">
      <div class="status-chip" id="statusChip">
        <div class="status-dot"></div>
        <span id="statusText">Capturing</span>
      </div>
      <div class="tab-bar">
        <button class="tab active" onclick="switchTab('all', this)">All</button>
        <button class="tab" onclick="switchTab('screens', this)">Screens</button>
        <button class="tab" onclick="switchTab('meetings', this)">Meetings</button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <div class="main" id="mainContent">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Frames</div>
        <div class="stat-value" id="statFrames">0</div>
        <div class="stat-sub" id="statLastCapture">no captures yet</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Meetings</div>
        <div class="stat-value" id="statMeetings">0</div>
        <div class="stat-sub" id="statLastMeeting">none detected</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Audio Chunks</div>
        <div class="stat-value" id="statAudio">0</div>
        <div class="stat-sub">transcribed locally</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Database</div>
        <div class="stat-value" id="statDb">0 MB</div>
        <div class="stat-sub">SQLite + FTS5</div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <button class="action-btn" onclick="runAutomation('standup-prep')">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Standup Prep
      </button>
      <button class="action-btn" onclick="runAutomation('day-recap')">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Day Recap
      </button>
      <button class="action-btn" onclick="runAutomation('missed-todos')">
        <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        Missed To-Dos
      </button>
      <button class="action-btn" onclick="runAutomation('blockers')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Blockers
      </button>
      <button class="action-btn" onclick="runAutomation('time-breakdown')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Time Breakdown
      </button>
      <button class="action-btn" onclick="captureNow()">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Capture Now
      </button>
    </div>

    <!-- Result Panel -->
    <div class="result-panel" id="resultPanel">
      <div class="result-panel-header">
        <div class="result-panel-title" id="resultTitle">Result</div>
        <button class="result-panel-close" onclick="closeResult()">&times;</button>
      </div>
      <div class="result-panel-body" id="resultBody">Loading...</div>
    </div>

    <!-- Timeline -->
    <div class="timeline-header">
      <div class="timeline-title">Activity Timeline</div>
    </div>
    <div class="timeline" id="timeline">
      <div style="padding: 40px; text-align: center; color: var(--text3); font-size: 13px;">
        Waiting for capture data...
      </div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <footer class="bottombar">
    <div class="bottombar-left">
      <span id="modelInfo">LM Studio &bull; localhost:1234</span>
      <span>&bull;</span>
      <span class="cost-badge">$0.00/mo</span>
      <span>&bull;</span>
      <span>100% on-device</span>
    </div>
    <div class="bottombar-right">
      <span id="dbSizeFooter">0 MB</span>
    </div>
  </footer>

  <script>
    const API = "http://127.0.0.1:3333/api";
    let currentFilter = "all";

    async function fetchStatus() {
      try {
        const res = await fetch(`${API}/status`);
        if (!res.ok) return;
        const d = await res.json();
        document.getElementById('statFrames').textContent = d.frames_count;
        document.getElementById('statMeetings').textContent = d.meetings_count;
        document.getElementById('statAudio').textContent = d.audio_chunks_count;
        document.getElementById('statDb').textContent = d.db_size_mb + " MB";
        document.getElementById('dbSizeFooter').textContent = d.db_size_mb + " MB";

        if (d.latest_capture && d.latest_capture !== "Never") {
          const t = new Date(d.latest_capture);
          document.getElementById('statLastCapture').textContent = "last: " + t.toLocaleTimeString();
        }
      } catch (e) {}
    }

    async function fetchTimeline() {
      const container = document.getElementById('timeline');
      let items = [];

      try {
        const [framesRes, meetingsRes] = await Promise.all([
          fetch(`${API}/frames?limit=50`),
          fetch(`${API}/meetings`)
        ]);

        const frames = await framesRes.json();
        const meetings = await meetingsRes.json();

        for (const f of frames) {
          if (currentFilter === 'meetings') continue;
          items.push({
            type: 'screen',
            time: f.captured_at,
            ts: new Date(f.captured_at).getTime(),
            text: f.preview || '(empty frame)',
          });
        }

        for (const m of meetings) {
          if (currentFilter === 'screens') continue;
          items.push({
            type: 'meeting',
            time: m.started_at,
            ts: new Date(m.started_at).getTime(),
            title: m.title,
            summary: m.summary || '',
          });
        }

        items.sort((a, b) => b.ts - a.ts);

        if (!items.length) {
          container.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text3); font-size: 13px;">No activity captured yet. Dayglass daemon will start recording automatically.</div>';
          return;
        }

        container.innerHTML = items.map((item, i) => {
          const time = new Date(item.time);
          const timeStr = time.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          const isLast = i === items.length - 1;
          const lineHtml = isLast ? '' : '<div class="marker-line"></div>';

          if (item.type === 'meeting') {
            return `
              <div class="timeline-item">
                <div class="timeline-time">${timeStr}</div>
                <div class="timeline-marker">
                  <div class="marker-dot meeting"></div>
                  ${lineHtml}
                </div>
                <div class="timeline-content">
                  <div class="timeline-type type-meeting">Meeting</div>
                  <div class="timeline-text meeting-title">${esc(item.title)}</div>
                  <div class="meeting-summary">${esc(item.summary)}</div>
                </div>
              </div>`;
          } else {
            return `
              <div class="timeline-item">
                <div class="timeline-time">${timeStr}</div>
                <div class="timeline-marker">
                  <div class="marker-dot screen"></div>
                  ${lineHtml}
                </div>
                <div class="timeline-content">
                  <div class="timeline-type type-screen">Screen</div>
                  <div class="timeline-text">${esc(item.text)}</div>
                </div>
              </div>`;
          }
        }).join('');

      } catch (e) {
        container.innerHTML = `<div style="padding: 40px; text-align: center; color: var(--red); font-size: 13px;">Error loading timeline: ${e.message}</div>`;
      }
    }

    function esc(s) {
      if (!s) return '';
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function switchTab(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      fetchTimeline();
    }

    async function captureNow() {
      try {
        const res = await fetch(`${API}/capture`, { method: "POST" });
        const data = await res.json();
        showResult("Capture", `Captured ${data.chars} chars of screen text.`);
        fetchStatus();
        fetchTimeline();
      } catch (e) {
        showResult("Capture Error", e.message);
      }
    }

    async function runAutomation(name) {
      showResult(name, "Running automation with local LM Studio...");
      try {
        const res = await fetch(`${API}/automate/${name}`, { method: "POST" });
        const data = await res.json();
        if (data.error) {
          showResult(name, "Error: " + data.error);
        } else {
          showResult(name, data.result);
        }
        fetchStatus();
      } catch (e) {
        showResult(name, "Failed: " + e.message);
      }
    }

    async function handleCommandKey(event) {
      if (event.key !== 'Enter' || event.shiftKey) return;
      const input = document.getElementById('commandInput');
      const q = input.value.trim();
      if (!q) return;
      input.value = "";

      showResult("Ask", "Querying local model...");
      try {
        const res = await fetch(`${API}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q })
        });
        const data = await res.json();
        showResult(`Ask: "${q}"`, data.error || data.answer);
      } catch (e) {
        showResult("Ask Error", e.message);
      }
    }

    function showResult(title, body) {
      document.getElementById('resultTitle').textContent = title;
      document.getElementById('resultBody').textContent = body;
      document.getElementById('resultPanel').style.display = 'block';
      document.getElementById('resultPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function closeResult() {
      document.getElementById('resultPanel').style.display = 'none';
    }

    fetchStatus();
    fetchTimeline();
    setInterval(fetchStatus, 15000);
    setInterval(fetchTimeline, 30000);
  </script>
</body>
</html>
