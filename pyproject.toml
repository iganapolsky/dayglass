[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dayglass"
version = "0.1.0"
description = "Local screen memory and ask. No cloud AI meter."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Igor Ganapolsky" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dayglass = "dayglass.cli:main"

[tool.setuptools.packages.find]
include = ["dayglass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
